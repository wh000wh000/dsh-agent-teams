# ── AgentTeams × Jev 决策层 ─────────────────────────────────────────────────
# 2026-09-18。给「自动修复轮次」的规划加一层语义判断：修复范围、交付者/
# 评审者、跨轮同源去重。默认关闭；这里显式打开。
#
# 为什么要重写整个 config：loader 规则是 **id 命中的条目整体替换该行 config**
# （不合并），所以 stateDir / memberProvider 必须一并写出，否则会被清空。
#
# 凭据：key 在 macOS 登录钥匙串 typesafe-jev/default，插件自己取，
# **不落盘、不进命令行、不进日志**。宿主进程的环境变量里没有它，这正是
# 走钥匙串的原因（launchd 的 EnvironmentVariables 是固定的）。如果哪天想用
# 环境变量覆盖，启动 dsh 前 export JEV_API_KEY=… 即可，优先级更高。
#
# 模型锁 jev-1.13.0 而不是 jev-latest：别名一动，阈值会在没改代码的情况下失效。
#
# 阈值按决策分别给，因为阈值是"某一个决策 + 某一批带标签样本"的属性，一个全局
# 数字会把某处的标定悄悄带到从没量过的地方。
#
# 已标定：去重（dedup）。语料 = 真实团队 t11 的 7 条 finding × 后来 10 条新
# finding = 70 对，正例 8 / 负例 62，证据用中文原文。结论：两堆概率**完全不重叠**
# （负例最高 0.23–0.37，正例最低 0.52–0.56）。官方起点 0.60 落在**正例堆里**，
# 会把真实匹配丢掉（中位次采样 TP 6 / FN 2，召回 0.75）。取两堆之间的 0.45：
# 三次采样假阳性全为 0，召回 0.88–1.00。
# 正例只有 8 个 —— 这是起点，不是定论；团队继续跑、标签累积后要重标。
#
# 未标定：repairScope 与 routing。它们没有标准答案可对（"该改哪些文件""该派给谁"
# 没有唯一正确解），所以沿用官方起点 0.60。
#
# scopePolicy: union 是安全方向 —— 决策可以补上散文里扫不出来的路径，但不会
# 删掉 finding 观察到或点名的路径；换成 replace 会收紧但可能让 repair 改不动
# 自己 inScope 之外的文件而永久卡住。
#
# 语言：**默认直接把团队自己的原文发给 Jev**，不再要求英译。原来的"非英文一律
# 弃权"是推断、不是实测；实测中文与英文在这批数据上打分完全一致（都是 4/10 全覆盖、
# 1 漏判、0 误判），差异只在第三位小数。英译保留成显式可选项：在这行下面加
# `translation: { provider: ..., model: ... }` 才会启用。
#
# 还没做的：置换测试（打乱选项顺序重跑）、以及 repairScope/routing 两个决策的标定
# —— 它们没有唯一正确答案可对，只能靠人工抽检。
- id: agent-teams
  config:
    stateDir: .agent-teams
    memberProvider: spawn
    jev:
      enabled: true
      model: jev-1.13.0
      # 未单独指定的决策用它（= 官方起点）
      minProbability: 0.6
      decisions:
        repairScope: true
        routing: true
        dedup: true
        scopePolicy: union
        minProbability:
          # 已按中文真实数据标定（70 对 / 正例 8）
          dedup: 0.45